[package]
name = "rawgeotag"
version = "0.1.0"
edition = "2021"
description = "Geotag camera raw files from a GPX track by writing XMP sidecars"
license = "MIT"

[dependencies]
anyhow = "1"
# `chrono` and `time` are both here because neither is our choice: `nom-exif`
# returns chrono types and `gpx` returns time types, so both arrive at the API
# boundary. chrono is the one the program actually speaks — `DateTime<Utc>` for
# instants, `TimeDelta` for durations — since nom-exif hands us those for free.
# `gpx`'s type is converted in exactly one function, `track_point` in track.rs.
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
gpx = "0.10"
indicatif = "0.18"
# The only pure-Rust crate that reads Canon CR3. The far more widely used
# `kamadak-exif` covers JPEG/TIFF/PNG/HEIF only — CR3 is a CRX-in-BMFF container,
# not TIFF-based — so it cannot do this job at any version. What nom-exif does
# and does not merge is the CR3 timezone trap; see CLAUDE.md before touching it.
nom-exif = "3.6"
rayon = "1"
# Atomic sidecar writes. Hand-rolling the temp-then-rename is a few lines, but
# this gets unique names (so concurrent runs over one directory cannot collide)
# and deletion on drop (so a failed write leaves nothing behind) for free.
# The tests use its `TempDir` for scratch directories for the same two reasons —
# a normal dependency rather than a dev-dependency, so it is available to both.
tempfile = "3"
time = "0.3" # see the note on chrono
walkdir = "2"

[profile.release]
# The workload is many short-lived parallel tasks over a large file count;
# whole-program optimization is worth the slower build for a released binary.
lto = "thin"
codegen-units = 1
