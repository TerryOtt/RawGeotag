# The half of docs/REVIEWING.md a machine can check, run where it cannot be skipped.
#
# The pre-commit hook in .githooks/ runs the same three checks before a commit is
# made. This is not redundant with it: a hook can be bypassed with --no-verify, only
# exists on a clone that ran `git config core.hooksPath .githooks`, and never sees a
# pull request from a fork. This does.
#
# windows-latest, because Windows is the only platform this tool actually ships on --
# the storage reasoning throughout CLAUDE.md is about NTFS and the verification
# harness is PowerShell, so testing somewhere the tool is never run would measure a
# configuration that does not occur.
#
# This costs nothing: Actions minutes are free and unlimited on public repositories,
# on any standard GitHub-hosted runner. The Windows 2x minute multiplier people warn
# about applies only to *private* repos, which get 2,000 free minutes a month. If
# this repo is ever made private, that multiplier starts to matter and ubuntu-latest
# becomes the frugal choice -- and note branch protection needs a paid plan at the
# same moment, so both bite together.
#
# Deliberately NOT here: scripts/verify-fixtures.ps1. It needs 222 MB of raw
# photographs that are not in version control, so it cannot run on a clean checkout.
# That check stays manual and local; see docs/FIXTURES.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only ever reads the checkout.
permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # --all-targets is the point: without it clippy does not lint test code at all,
      # and there is more of that here than there is implementation.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
